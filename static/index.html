<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Crawler</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
        h1 { color: #333; }
        .controls { margin-bottom: 20px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #0056b3; }
        .job-list { margin-top: 20px; }
        .job-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 4px; }
        .job-card h3 { margin: 0 0 5px 0; }
        .job-card p { margin: 5px 0; color: #666; font-size: 0.9em; }
        .job-card a { text-decoration: none; color: #007bff; font-weight: bold; font-size: 1.1em; }
        /* Visited link style - requested feature */
        .job-card a:visited { color: #551a8b; }
        .date-group { margin-top: 30px; border-bottom: 2px solid #eee; padding-bottom: 5px; font-weight: bold; font-size: 1.2em; color: #444; }
    </style>
</head>
<body>
    <h1>Hong Kong Internship Crawler</h1>

    <div class="controls">
        <button id="crawlBtn" onclick="startCrawl()">Fetch Latest Jobs</button>
        <span id="status" style="margin-left: 10px; color: #666;"></span>
    </div>

    <div id="jobContainer"></div>

    <script>
        async function loadJobs() {
            const response = await fetch('/api/jobs');
            const jobs = await response.json();
            const container = document.getElementById('jobContainer');
            container.innerHTML = '';

            // Group by crawled date (day)
            const grouped = {};
            jobs.forEach(job => {
                const date = new Date(job.crawled_at).toLocaleDateString();
                if (!grouped[date]) grouped[date] = [];
                grouped[date].push(job);
            });

            for (const date in grouped) {
                const groupHeader = document.createElement('div');
                groupHeader.className = 'date-group';
                groupHeader.innerText = `Found on: ${date}`;
                container.appendChild(groupHeader);

                grouped[date].forEach(job => {
                    const card = document.createElement('div');
                    card.className = 'job-card';
                    card.innerHTML = `
                        <div>
                            <a href="${job.link}" target="_blank">${job.title}</a>
                        </div>
                        <p><strong>${job.company}</strong> - ${job.location}</p>
                        <p>Posted: ${job.date_posted}</p>
                    `;
                    container.appendChild(card);
                });
            }
        }

        async function startCrawl() {
            const btn = document.getElementById('crawlBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.innerText = "Crawling started in background...";

            try {
                await fetch('/api/crawl', { method: 'POST' });
                // We won't wait for it to finish as it's a background task,
                // but we can poll or just tell user to refresh later.
                // For better UX, let's wait a bit and refresh.
                status.innerText = "Crawling in background. Refresh page in a minute to see results.";
            } catch (e) {
                status.innerText = "Error starting crawl.";
            } finally {
                setTimeout(() => { btn.disabled = false; }, 3000);
            }
        }

        // Initial load
        loadJobs();
    </script>
</body>
</html>
